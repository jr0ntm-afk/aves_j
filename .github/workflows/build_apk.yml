name: Build Debug APK

on:
  push:
    branches:
      - album-4grid-preview
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          # use RUNNER_TEMP (provided by GitHub runner) to store SDK
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"

          # download command line tools zip and unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          rm cmdline.zip

          # The zip usually extracts a folder named 'cmdline-tools'
          # Move it to 'latest' so the layout becomes cmdline-tools/latest/bin/...
          if [ -d "cmdline-tools" ]; then
            mv cmdline-tools latest
          elif [ -d "tools" ]; then
            mv tools latest
          fi

          # Ensure platform-tools dir exists
          mkdir -p "$ANDROID_SDK_ROOT/platform-tools"

          # Add the commandlinetools bin to PATH for THIS STEP, so sdkmanager is found immediately.
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          # Accept licenses and install required components
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.0"

          # Also persist platform-tools and cmdline-tools to subsequent steps by appending to GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Set up Flutter (pin explicit version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/**/app-debug.apk
