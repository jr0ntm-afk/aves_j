name: Build APK for PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (for Android build tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Accept Android licenses and check environment
        run: |
          # accept licenses (some runners may require interactive acceptance)
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --no-shrink -v

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Comment on PR with workflow run link
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request in context');
              return;
            }
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `Built debug APK for this PR. Download the artifact from the Actions run: ${runUrl}\n\nArtifacts are listed under the "Artifacts" section of that run.`;
            await github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });