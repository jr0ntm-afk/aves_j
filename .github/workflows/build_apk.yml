name: Build Debug APK (play) + tests (with cache)

on:
  push:
    branches:
      - album-4grid-preview
  pull_request:
    branches:
      - album-4grid-preview
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter (pin explicit version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'

      # Cache pub packages to speed up `flutter pub get`
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.pub-cache/bin
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Cache Gradle to speed up Android builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run widget tests (fail fast)
        run: |
          flutter pub get
          flutter test
        # If this step fails the job will stop here -> prevents wasted build time

      - name: Setup Java (Temurin 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          rm cmdline.zip

          if [ -d "cmdline-tools" ]; then
            mv cmdline-tools latest
          elif [ -d "tools" ]; then
            mv tools latest
          fi

          mkdir -p "$ANDROID_SDK_ROOT/platform-tools"

          # Make sdkmanager available in THIS step (export PATH)
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.0"

          # Persist for subsequent steps
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (play)
        run: flutter build apk --debug --no-shrink --flavor play -t lib/main_play.dart

      - name: Upload APK artifact (play)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-play
          path: build/app/outputs/**/app-*-debug.apk
